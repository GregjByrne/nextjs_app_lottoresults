version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e CLERK_SECRET_KEY -e NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY -e DATABASE_HOST -e DATABASE_USER -e DATABASE_PASSWORD -e DATABASE_NAME -e SSL_CERT_PATH >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*